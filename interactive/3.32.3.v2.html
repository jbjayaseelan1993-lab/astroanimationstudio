<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Project</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overflow: hidden;
    }

    #animation_container, #_preload_div_ {
        position: absolute;
        margin: auto;
        left: 0; right: 0;
        top: 0; bottom: 0;
    }
</style>

<!-- CreateJS Library -->

<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>

<!-- Your Animate JS File -->

<script src="3.32.3.v2.js"></script>

<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;

function init() {
    canvas = document.getElementById("canvas");
    anim_container = document.getElementById("animation_container");
    dom_overlay_container = document.getElementById("dom_overlay_container");

    var comp = AdobeAn.getComposition("0B0B178C43F6B9458B1C95FD957EA635");
    var lib = comp.getLibrary();

    var loader = new createjs.LoadQueue(false);
    loader.installPlugin(createjs.Sound);

    loader.addEventListener("fileload", function(evt) {
        handleFileLoad(evt, comp);
    });

    loader.addEventListener("complete", function(evt) {
        handleComplete(evt, comp);
    });

    loader.loadManifest(lib.properties.manifest);
}

function handleFileLoad(evt, comp) {
    var images = comp.getImages();
    if (evt && evt.item.type === "image") {
        images[evt.item.id] = evt.result;
    }
}

function handleComplete(evt, comp) {
    var lib = comp.getLibrary();
    var ss = comp.getSpriteSheet();
    var queue = evt.target;
    var ssMetadata = lib.ssMetadata;

    // FIXED: declared 'i'
    for (var i = 0; i < ssMetadata.length; i++) {
        ss[ssMetadata[i].name] = new createjs.SpriteSheet({
            images: [queue.getResult(ssMetadata[i].name)],
            frames: ssMetadata[i].frames
        });
    }

    var preloaderDiv = document.getElementById("_preload_div_");
    preloaderDiv.style.display = "none";

    canvas.style.display = "block";

    exportRoot = new lib._3323v2();
    stage = new lib.Stage(canvas);

    fnStartAnimation = function () {
        stage.addChild(exportRoot);
        createjs.Ticker.framerate = lib.properties.fps;
        createjs.Ticker.addEventListener("tick", stage);
    };

    // Responsive scaling (fixed stretch issue)
    AdobeAn.makeResponsive(true, "both", false, 1, [canvas, preloaderDiv, anim_container, dom_overlay_container]);

    AdobeAn.compositionLoaded(lib.properties.id);
    fnStartAnimation();
}

function playSound(id, loop, offset) {
    return createjs.Sound.play(id, {
        interrupt: createjs.Sound.INTERRUPT_EARLY,
        loop: loop,
        offset: offset
    });
}
</script>

</head>

<body onload="init();">

<div id="animation_container" style="width:1024px; height:576px;">
    <canvas id="canvas" width="1024" height="576" style="position:absolute; display:none;"></canvas>

```
<div id="dom_overlay_container"
    style="pointer-events:none; overflow:hidden; width:1024px; height:576px; position:absolute; left:0; top:0; display:none;">
</div>
```

</div>

<div id="_preload_div_" style="position:absolute; top:0; left:0; width:1024px; height:576px; text-align:center;">
    <span style="display:inline-block; height:100%; vertical-align:middle;"></span>
    <img src="images/_preloader.gif" style="vertical-align:middle; max-height:100%;">
</div>

</body>
</html>
